[workspace]
resolver = "2"
members = ["crates/grbl-core", "crates/virtual-grbl", "crates/grbl-link", "src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
serialport = "4"

[profile.release]
codegen-units = 1
lto = true
strip = true
